# MusAgent docker-compose — 一键启动全栈
# 用法：
#   docker-compose up                  # 启动
#   docker-compose down                # 停止
#   DEEPSEEK_API_KEY=sk-xxx docker-compose up   # 注入 API Key
version: "3.9"

services:
  musagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musagent-app
    restart: unless-stopped
    ports:
      - "8000:8000"      # 后端 API（同时托管前端构建产物）
      # - "5173:5173"    # 取消注释可同时跑前端 dev server
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.8}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-500}
      - EMBED_MODEL=${EMBED_MODEL:-BAAI/bge-small-zh-v1.5}
      - RERANK_MODEL=${RERANK_MODEL:-BAAI/bge-reranker-base}
      - SENTIMENT_MODEL=${SENTIMENT_MODEL:-uer/roberta-base-finetuned-jd-binary-chinese}
      - NER_MODEL=${NER_MODEL:-ckiplab/bert-base-chinese-ner}
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化 SQLite（首次启动会创建空库，导入数据后存在这里）
      - musagent-data:/app/back/data
      # HuggingFace 模型缓存（首次启动会拉取约 2-3 GB）
      - musagent-cache:/app/back/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：开发模式前端 dev server（独立服务）
  # 用 docker-compose --profile dev up frontend-dev 启动
  frontend-dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: musagent-frontend-dev
    working_dir: /app/musagent
    volumes:
      - ./musagent:/app/musagent
      - /app/musagent/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_BASE=http://localhost:8000/api

volumes:
  musagent-data:
    driver: local
  musagent-cache:
    driver: local
